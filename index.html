<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pantry Expiry Food Tracker</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-50 min-h-screen">
<div class="max-w-4xl mx-auto p-4">
  <h1 class="text-3xl font-bold text-green-900 mb-6 flex items-center gap-2">
    🥫 Pantry Expiry Food Tracker
  </h1>

  <!-- Add Form -->
  <div class="bg-white rounded-2xl shadow-md p-6 mb-6">
    <h2 class="text-xl font-semibold text-green-800 mb-4">アイテムを追加</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label for="itemName" class="block text-sm font-medium text-gray-700 mb-1">アイテム名 *</label>
        <input id="itemName" type="text" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-400" placeholder="例: トマト缶">
      </div>
      <div>
        <label for="category" class="block text-sm font-medium text-gray-700 mb-1">カテゴリ</label>
        <select id="category" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-400">
          <option value="缶詰">缶詰</option>
          <option value="乾物">乾物</option>
          <option value="調味料">調味料</option>
          <option value="冷凍食品">冷凍食品</option>
          <option value="飲料">飲料</option>
          <option value="菓子">菓子</option>
          <option value="その他">その他</option>
        </select>
      </div>
      <div>
        <label for="quantity" class="block text-sm font-medium text-gray-700 mb-1">数量</label>
        <input id="quantity" type="text" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-400" placeholder="例: 2個">
      </div>
      <div>
        <label for="expiry" class="block text-sm font-medium text-gray-700 mb-1">賞味期限 *</label>
        <input id="expiry" type="date" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-400">
      </div>
    </div>
    <button onclick="addItem()" class="mt-4 bg-green-700 hover:bg-green-800 text-white font-semibold px-6 py-2 rounded-lg transition" aria-label="アイテムを追加">
      追加する
    </button>
  </div>

  <!-- Stats -->
  <div class="grid grid-cols-3 gap-4 mb-6">
    <div class="bg-red-100 rounded-xl p-4 text-center">
      <p id="expiredCount" class="text-2xl font-bold text-red-700">0</p>
      <p class="text-sm text-red-600">期限切れ</p>
    </div>
    <div class="bg-yellow-100 rounded-xl p-4 text-center">
      <p id="soonCount" class="text-2xl font-bold text-yellow-700">0</p>
      <p class="text-sm text-yellow-600">7日以内</p>
    </div>
    <div class="bg-green-100 rounded-xl p-4 text-center">
      <p id="okCount" class="text-2xl font-bold text-green-700">0</p>
      <p class="text-sm text-green-600">正常</p>
    </div>
  </div>

  <!-- Items List -->
  <div id="itemsList" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
  <p id="empty-msg" class="text-center text-gray-400 py-12 hidden">パントリーが空です。アイテムを追加してください。</p>
</div>

<script>
function getItems() {
  try { return JSON.parse(localStorage.getItem('pantryItems') || '[]'); } catch(e) { return []; }
}

function saveItems(items) {
  localStorage.setItem('pantryItems', JSON.stringify(items));
}

function today() {
  return new Date().toISOString().slice(0, 10);
}

function daysUntil(dateStr) {
  const now = new Date(today());
  const exp = new Date(dateStr);
  return Math.floor((exp - now) / (1000 * 60 * 60 * 24));
}

function addItem() {
  const name = document.getElementById('itemName').value.trim();
  const expiry = document.getElementById('expiry').value;
  if (!name || !expiry) {
    alert('アイテム名と賞味期限は必須です');
    return;
  }
  const item = {
    id: Date.now(),
    name,
    category: document.getElementById('category').value,
    quantity: document.getElementById('quantity').value.trim() || '1個',
    expiry
  };
  const items = getItems();
  items.push(item);
  saveItems(items);
  document.getElementById('itemName').value = '';
  document.getElementById('quantity').value = '';
  document.getElementById('expiry').value = '';
  render();
}

function deleteItem(id) {
  saveItems(getItems().filter(i => i.id !== id));
  render();
}

function getStatus(expiry) {
  const days = daysUntil(expiry);
  if (days < 0) return 'expired';
  if (days <= 7) return 'soon';
  return 'ok';
}

function render() {
  const items = getItems().sort((a, b) => a.expiry.localeCompare(b.expiry));
  const container = document.getElementById('itemsList');
  const emptyMsg = document.getElementById('empty-msg');
  container.innerHTML = '';

  let expired = 0, soon = 0, ok = 0;
  items.forEach(item => {
    const s = getStatus(item.expiry);
    if (s === 'expired') expired++;
    else if (s === 'soon') soon++;
    else ok++;
  });

  document.getElementById('expiredCount').textContent = expired;
  document.getElementById('soonCount').textContent = soon;
  document.getElementById('okCount').textContent = ok;

  if (items.length === 0) {
    emptyMsg.classList.remove('hidden');
    return;
  }
  emptyMsg.classList.add('hidden');

  items.forEach(item => {
    const status = getStatus(item.expiry);
    const days = daysUntil(item.expiry);

    const colorMap = {
      expired: 'border-red-400 bg-red-50',
      soon: 'border-yellow-400 bg-yellow-50',
      ok: 'border-green-400 bg-green-50'
    };
    const badgeMap = {
      expired: 'bg-red-500 text-white',
      soon: 'bg-yellow-500 text-white',
      ok: 'bg-green-500 text-white'
    };
    const labelMap = {
      expired: '期限切れ',
      soon: days === 0 ? '今日まで' : days + '日後',
      ok: days + '日後'
    };

    const card = document.createElement('div');
    card.className = 'rounded-xl border-2 p-4 flex justify-between items-start ' + colorMap[status];

    const left = document.createElement('div');

    const nameEl = document.createElement('p');
    nameEl.className = 'font-semibold text-gray-800';
    nameEl.textContent = item.name;
    left.appendChild(nameEl);

    const meta = document.createElement('p');
    meta.className = 'text-sm text-gray-600 mt-1';
    meta.textContent = item.category + ' · ' + item.quantity;
    left.appendChild(meta);

    const dateEl = document.createElement('p');
    dateEl.className = 'text-sm text-gray-500 mt-1';
    dateEl.textContent = '賞味期限: ' + item.expiry;
    left.appendChild(dateEl);

    card.appendChild(left);

    const right = document.createElement('div');
    right.className = 'flex flex-col items-end gap-2';

    const badge = document.createElement('span');
    badge.className = 'text-xs font-bold px-2 py-1 rounded-full ' + badgeMap[status];
    badge.textContent = labelMap[status];
    right.appendChild(badge);

    const delBtn = document.createElement('button');
    delBtn.className = 'text-gray-300 hover:text-red-400 text-lg transition';
    delBtn.textContent = '×';
    delBtn.setAttribute('aria-label', item.name + 'を削除');
    delBtn.onclick = () => deleteItem(item.id);
    right.appendChild(delBtn);

    card.appendChild(right);
    container.appendChild(card);
  });
}

render();
</script>
</body>
</html>
